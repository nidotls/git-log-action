name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name:
          Verify the integrity of provenance attestations and registry
          signatures for installed dependencies
        run: npm audit signatures

      - name: Build
        run: npm run package

      # Versions are pinned to major ranges. Unpinned installs broke the
      # release when conventional-changelog-conventionalcommits@10 started
      # requiring conventional-changelog-writer@9, which
      # @semantic-release/release-notes-generator@14 does not ship.
      - name: Install semantic-release and plugins
        run:
          'npm install -g semantic-release@^25 @semantic-release/changelog@^7
          @semantic-release/commit-analyzer@^13 @semantic-release/exec@^7
          @semantic-release/git@^11 @semantic-release/github@^12
          @semantic-release/release-notes-generator@^14
          conventional-changelog-conventionalcommits@^9'

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
